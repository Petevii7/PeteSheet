name: Pete Sheet Weekly Concert Email
on:
  schedule:
    - cron: "0 10 * * 1"   # Every Monday at 6 AM EST (10 UTC)
  workflow_dispatch:

jobs:
  send_concerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run collector
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: python collector_v9.py